<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puntos para Juan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: #2f4fd8;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  h1 { font-size: 28px; font-weight: 800; padding: 0 16px; }
  #puntos { font-size: 120px; font-weight: 900; line-height: 1; }
  #puntos.pop { transform: scale(1.2); }
  #puntos { transition: transform .1s; }
  p { font-size: 18px; opacity: .8; }
  button {
    border: 0;
    background: #fff;
    color: #2f4fd8;
    font-size: 16px;
    font-weight: 700;
    padding: 10px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>¡Tocá para sumarle un punto a Juan!</h1>
  <div id="puntos">65</div>
  <p>puntos de Juan</p>
  <button id="reiniciar">Reiniciar</button>

<script>
  let puntos = 65;
  const el = document.getElementById("puntos");

  document.body.addEventListener("click", () => {
    puntos++;
    el.textContent = puntos;
    el.classList.add("pop");
    setTimeout(() => el.classList.remove("pop"), 100);
  });

  document.getElementById("reiniciar").addEventListener("click", (e) => {
    e.stopPropagation();
    puntos = 65;
    el.textContent = puntos;
  });
</script>
</body>
</html>
