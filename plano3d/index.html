<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano en 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #dde1ea; --accent: #2f6fde; --plane: #2f6fde;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b2029; --text: #e7ebf3; --muted: #9aa3b5;
      --border: #2c3341; --accent: #6d9cff; --plane: #6d9cff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .layout {
    display: grid; grid-template-columns: 340px 1fr; gap: 16px;
    padding: 16px; min-height: 100vh;
  }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .equation {
    font-family: "Cambria Math", Georgia, serif; font-size: 1.35rem;
    text-align: center; padding: 12px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  }
  .control { margin-bottom: 14px; }
  .control label {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; margin-bottom: 6px;
  }
  .control input[type=number] {
    width: 80px; padding: 4px 6px; font: inherit; text-align: right;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text);
  }
  .control input[type=range] { width: 100%; accent-color: var(--accent); }
  .info { font-size: .9rem; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 12px; }
  .info b { color: var(--muted); font-weight: 600; }
  .warn { color: #d24b4b; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
  button {
    font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 6px; font-size: .9rem; margin-bottom: 6px; }
  #plot { width: 100%; height: calc(100vh - 32px); min-height: 420px; }
  @media (max-width: 820px) { #plot { height: 70vh; } }
</style>
</head>
<body>
<div class="layout">
  <div class="panel">
    <h1>Plano en 3D</h1>
    <p class="sub">Ecuación general: Ax + By + Cz + D = 0</p>

    <div class="equation" id="equation"></div>

    <div id="controls"></div>

    <div class="row">
      <button data-preset="0,0,1,0">Plano XY</button>
      <button data-preset="0,1,0,0">Plano XZ</button>
      <button data-preset="1,0,0,0">Plano YZ</button>
      <button data-preset="1,1,1,-3">x+y+z=3</button>
    </div>

    <label class="check"><input type="checkbox" id="showNormal" checked> Mostrar vector normal</label>
    <label class="check"><input type="checkbox" id="showIntercepts" checked> Mostrar cortes con los ejes</label>
    <label class="check">Rango de ejes ±
      <input type="number" id="range" value="5" min="1" max="50" step="1" style="width:60px">
    </label>

    <div class="info" id="info"></div>
  </div>

  <div class="panel" style="padding:6px"><div id="plot"></div></div>
</div>

<script>
const params = { A: 1, B: 1, C: 1, D: -3 };
const colors = { A: "#d24b4b", B: "#2e9e5b", C: "#2f6fde", D: "#9a6bd6" };

// Construye los controles (deslizador + campo numérico) para cada coeficiente
const controls = document.getElementById("controls");
for (const k of Object.keys(params)) {
  const div = document.createElement("div");
  div.className = "control";
  div.innerHTML = `
    <label><span style="color:${colors[k]}">${k}</span>
      <input type="number" step="0.1" id="num${k}" value="${params[k]}"></label>
    <input type="range" min="-10" max="10" step="0.1" id="rng${k}" value="${params[k]}">`;
  controls.appendChild(div);
  const num = div.querySelector("#num" + k), rng = div.querySelector("#rng" + k);
  rng.addEventListener("input", () => { params[k] = +rng.value; num.value = rng.value; render(); });
  num.addEventListener("input", () => {
    if (num.value === "" || isNaN(+num.value)) return;
    params[k] = +num.value; rng.value = num.value; render();
  });
}

document.querySelectorAll("[data-preset]").forEach(btn => btn.addEventListener("click", () => {
  const [A, B, C, D] = btn.dataset.preset.split(",").map(Number);
  Object.assign(params, { A, B, C, D });
  for (const k in params) {
    document.getElementById("num" + k).value = params[k];
    document.getElementById("rng" + k).value = params[k];
  }
  render();
}));
["showNormal", "showIntercepts", "range"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));

const fmt = v => Math.abs(v) < 1e-9 ? "0" : (+v.toFixed(3)).toString();

function equationText({ A, B, C, D }) {
  return linear([[A, "x"], [B, "y"], [C, "z"], [D, ""]]) + " = 0";
}

// Escribe una suma de términos coeficiente·variable con signos prolijos
function linear(all) {
  const terms = all.filter(([c]) => Math.abs(c) > 1e-12);
  if (!terms.length) return "0";
  return terms.map(([c, v], i) => {
    const sign = c < 0 ? (i ? " − " : "−") : (i ? " + " : "");
    const abs = Math.abs(c);
    const coef = v && abs === 1 ? "" : fmt(abs);
    return sign + coef + (v ? `<i>${v}</i>` : "");
  }).join("");
}

// Intersección del plano con el cubo [-L, L]^3: devuelve el polígono ordenado
function planeInCube(A, B, C, D, L) {
  const corners = [];
  for (const x of [-L, L]) for (const y of [-L, L]) for (const z of [-L, L]) corners.push([x, y, z]);
  const f = p => A * p[0] + B * p[1] + C * p[2] + D;
  const pts = [];
  for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
    const p = corners[i], q = corners[j];
    // sólo aristas del cubo (difieren en una coordenada)
    if (p.filter((v, t) => v !== q[t]).length !== 1) continue;
    const fp = f(p), fq = f(q);
    if (Math.abs(fp) < 1e-12) pts.push(p);
    if (fp * fq < 0) {
      const t = fp / (fp - fq);
      pts.push(p.map((v, s) => v + t * (q[s] - v)));
    }
  }
  // quitar duplicados
  const uniq = [];
  for (const p of pts) if (!uniq.some(u => Math.hypot(u[0]-p[0], u[1]-p[1], u[2]-p[2]) < 1e-9)) uniq.push(p);
  if (uniq.length < 3) return [];
  // ordenar por ángulo alrededor del centro, en la base del plano
  const c = [0, 1, 2].map(s => uniq.reduce((a, p) => a + p[s], 0) / uniq.length);
  const n = [A, B, C];
  const ref = Math.abs(A) < 0.9 * Math.hypot(A, B, C) ? [1, 0, 0] : [0, 1, 0];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const u = cross(n, ref), v = cross(n, u);
  return uniq.sort((p, q) => {
    const dp = p.map((x, s) => x - c[s]), dq = q.map((x, s) => x - c[s]);
    return Math.atan2(dot(dp, v), dot(dp, u)) - Math.atan2(dot(dq, v), dot(dq, u));
  });
}

function render() {
  const { A, B, C, D } = params;
  const L = Math.max(1, +document.getElementById("range").value || 5);
  const css = getComputedStyle(document.documentElement);
  const textColor = css.getPropertyValue("--text").trim();
  const gridColor = css.getPropertyValue("--border").trim();
  const planeColor = css.getPropertyValue("--plane").trim();

  document.getElementById("equation").innerHTML = equationText(params);

  const traces = [];
  // Ejes coordenados
  const axis = (end, color, name) => traces.push({
    type: "scatter3d", mode: "lines+text", name,
    x: [-end[0], end[0]], y: [-end[1], end[1]], z: [-end[2], end[2]],
    text: ["", name], textposition: "top center", textfont: { color, size: 16 },
    line: { color, width: 5 }, hoverinfo: "skip", showlegend: false
  });
  axis([L, 0, 0], colors.A, "x");
  axis([0, L, 0], colors.B, "y");
  axis([0, 0, L], colors.C, "z");

  const nLen = Math.hypot(A, B, C);
  const info = [];

  if (nLen === 0) {
    info.push(`<span class="warn">A, B y C no pueden ser todos 0: no es un plano.</span>`);
  } else {
    const poly = planeInCube(A, B, C, D, L);
    if (poly.length) {
      const i = [], j = [], k = [];
      for (let t = 1; t < poly.length - 1; t++) { i.push(0); j.push(t); k.push(t + 1); }
      traces.push({
        type: "mesh3d", name: "plano",
        x: poly.map(p => p[0]), y: poly.map(p => p[1]), z: poly.map(p => p[2]),
        i, j, k, color: planeColor, opacity: 0.55, flatshading: true,
        hovertemplate: "(%{x:.2f}, %{y:.2f}, %{z:.2f})<extra></extra>"
      });
      traces.push({
        type: "scatter3d", mode: "lines", hoverinfo: "skip", showlegend: false,
        x: [...poly, poly[0]].map(p => p[0]), y: [...poly, poly[0]].map(p => p[1]),
        z: [...poly, poly[0]].map(p => p[2]), line: { color: planeColor, width: 3 }
      });
    } else {
      info.push(`<span class="warn">El plano queda fuera del rango visible (±${L}). Aumentá el rango.</span>`);
    }

    // Punto del plano más cercano al origen
    const t = -D / (nLen * nLen);
    const P0 = [A * t, B * t, C * t];

    if (document.getElementById("showNormal").checked) {
      const s = L * 0.35 / nLen;
      const tip = [P0[0] + A * s, P0[1] + B * s, P0[2] + C * s];
      traces.push({
        type: "scatter3d", mode: "lines", name: "normal", hoverinfo: "skip", showlegend: false,
        x: [P0[0], tip[0]], y: [P0[1], tip[1]], z: [P0[2], tip[2]],
        line: { color: "#e39b22", width: 7 }
      });
      traces.push({
        type: "cone", x: [tip[0]], y: [tip[1]], z: [tip[2]], u: [A / nLen], v: [B / nLen], w: [C / nLen],
        sizemode: "absolute", sizeref: L * 0.12, anchor: "tip",
        colorscale: [[0, "#e39b22"], [1, "#e39b22"]], showscale: false, hoverinfo: "skip"
      });
    }

    // Cortes con los ejes
    const inter = [];
    if (A !== 0) inter.push(["x", [-D / A, 0, 0]]);
    if (B !== 0) inter.push(["y", [0, -D / B, 0]]);
    if (C !== 0) inter.push(["z", [0, 0, -D / C]]);
    if (document.getElementById("showIntercepts").checked && inter.length) {
      const vis = inter.filter(([, p]) => p.every(v => Math.abs(v) <= L));
      traces.push({
        type: "scatter3d", mode: "markers+text", showlegend: false,
        x: vis.map(([, p]) => p[0]), y: vis.map(([, p]) => p[1]), z: vis.map(([, p]) => p[2]),
        text: vis.map(([, p]) => `(${p.map(fmt).join(", ")})`), textposition: "top right",
        textfont: { color: textColor }, marker: { size: 5, color: "#e39b22" },
        hovertemplate: "(%{x:.2f}, %{y:.2f}, %{z:.2f})<extra></extra>"
      });
    }

    info.push(`<b>Vector normal:</b> n = (${fmt(A)}, ${fmt(B)}, ${fmt(C)})`);
    info.push(`<b>|n|:</b> ${fmt(nLen)}`);
    info.push(`<b>Distancia al origen:</b> |D| / |n| = ${fmt(Math.abs(D) / nLen)}`);
    info.push(`<b>Cortes con los ejes:</b> ` +
      (["x", "y", "z"].map(ax => {
        const it = inter.find(([n]) => n === ax);
        return `${ax}: ${it ? fmt(it[1][["x","y","z"].indexOf(ax)]) : "no corta (paralelo)"}`;
      }).join(" · ")));
    if (C !== 0) {
      info.push(`<b>Forma explícita:</b> <i>z</i> = ${linear([[-A / C, "x"], [-B / C, "y"], [-D / C, ""]])}`);
    }
    if (D !== 0 && A && B && C) {
      info.push(`<b>Forma segmentaria:</b> x/${fmt(-D / A)} + y/${fmt(-D / B)} + z/${fmt(-D / C)} = 1`);
    }
  }
  document.getElementById("info").innerHTML = info.join("<br>");

  const ax = title => ({
    title, range: [-L, L], color: textColor, gridcolor: gridColor,
    zerolinecolor: gridColor, backgroundcolor: "rgba(0,0,0,0)", showbackground: true
  });
  const layout = {
    paper_bgcolor: "rgba(0,0,0,0)", font: { color: textColor },
    margin: { l: 0, r: 0, t: 0, b: 0 }, showlegend: false,
    uirevision: "keep", // conserva la rotación de la cámara al cambiar valores
    scene: {
      xaxis: ax("x"), yaxis: ax("y"), zaxis: ax("z"),
      aspectmode: "cube", camera: { eye: { x: 1.6, y: 1.4, z: 1.1 } }
    }
  };
  Plotly.react("plot", traces, layout, { responsive: true, displaylogo: false });
}

render();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
</html>
